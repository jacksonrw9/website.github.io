<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phizzle Interactive Booth</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    font-family: 'Lato', sans-serif;
    background: #c8dde4;
    background-image: url('https://res.cloudinary.com/dqiggfeuq/image/upload/q_auto/f_auto/v1776357718/wavy-4K_ydrqeh.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    cursor: default;
  }

  /* === LAYOUT (designed at 1920x1080, scaled by JS) === */
  .dashboard {
    width: 100%; height: 100%;
    display: grid;
    grid-template-columns: 5fr 2fr;
    grid-template-rows: auto 1fr;
    column-gap: 60px;
    padding: 40px 30px;
  }

  /* === LOGO === */
  .logo-area {
    grid-column: 1 / -1;
    grid-row: 1;
    padding-top: 18px;
  }
  .logo-area img { height: 100px; width: auto; }

  /* === VIDEO === */
  .video-area {
    grid-column: 1;
    grid-row: 2;
    display: flex;
    align-items: center;
    min-height: 0;
  }
  .video-container {
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 16px;
    overflow: hidden;
    background: #1a3a4a;
    border: 6px solid #0D1B2A;
    position: relative;
    box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    cursor: pointer;
  }
  .local-video {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .video-thumbnail {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 1;
  }
  .play-btn {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 110px; height: 110px;
    z-index: 3;
    filter: drop-shadow(0 4px 16px rgba(0,0,0,0.3));
    transition: transform 0.25s ease;
  }
  .play-btn:hover { transform: translate(-50%, -50%) scale(1.08); }
  .video-container.playing .play-btn,
  .video-container.playing .video-thumbnail { display: none; }
  .video-container.playing.paused .play-btn { display: block; }

  /* === QR CODE === */
  .qr-caption {
    font-size: 44px;
    font-weight: 900;
    line-height: 1.2;
    color: #2E3A47;
    text-align: center;
    margin-top: 28px;
    max-width: 480px;
  }
  .qr-area {
    grid-column: 2;
    grid-row: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  .qr-area img {
    width: 100%;
    max-width: 480px;
    height: auto;
    display: block;
    border: 6px solid #0D1B2A;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.15);
  }

  /* === ENTRANCE === */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .anim-in {
    animation: fadeInUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    opacity: 0;
  }
  .anim-d1 { animation-delay: 0.1s; }
  .anim-d2 { animation-delay: 0.2s; }
  .anim-d3 { animation-delay: 0.35s; }
  @media (prefers-reduced-motion: reduce) {
    .anim-in { animation: none; opacity: 1; }
  }
</style>
</head>
<body>

<div class="dashboard">
  <div class="logo-area anim-in anim-d1">
    <img src="https://res.cloudinary.com/dqiggfeuq/image/upload/v1790268391/Phizzle-Primary_Logo-large_pm2l6d.png" alt="Phizzle">
  </div>

  <div class="video-area anim-in anim-d2">
    <div class="video-container" id="videoContainer" onclick="toggleVideo()">
      <img class="video-thumbnail" src="https://res.cloudinary.com/dqiggfeuq/image/upload/q_auto/f_auto/v1757081556/edgepuck-hero_t4aaxo.jpg" alt="">
      <video id="localVideo" class="local-video" preload="metadata" playsinline loop>
        <source src="https://res.cloudinary.com/dqiggfeuq/video/upload/v1790355286/Connector_Plus_Demo_Marketing_2_mlbor3.mp4" type="video/mp4">
      </video>
      <div class="play-btn">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="48" fill="white" />
          <circle cx="50" cy="50" r="42" fill="#00A86B" />
          <polygon points="40,28 74,50 40,72" fill="white" />
        </svg>
      </div>
    </div>
  </div>

  <div class="qr-area anim-in anim-d3">
    <img src="https://res.cloudinary.com/dqiggfeuq/image/upload/v1790355616/phizzle-get-in-touch-qr_tvuqpz.png" alt="Scan to get in touch with Phizzle">
    <div class="qr-caption">Scan For More Information</div>
  </div>
</div>

<script>
  const container = document.getElementById('videoContainer');
  const video = document.getElementById('localVideo');

  // First tap starts the video with sound; it then loops continuously.
  // Tapping again pauses; tapping once more resumes.
  function toggleVideo() {
    if (!container.classList.contains('playing')) {
      container.classList.add('playing');
      container.classList.remove('paused');
      video.currentTime = 0;
      video.play();
    } else if (container.classList.contains('paused')) {
      container.classList.remove('paused');
      video.play();
    } else {
      container.classList.add('paused');
      video.pause();
    }
  }

  // Resume if the browser pauses it on its own (e.g. screen sleep),
  // but never override a pause someone chose.
  function shouldBePlaying() {
    return container.classList.contains('playing') && !container.classList.contains('paused');
  }
  video.addEventListener('pause', () => {
    setTimeout(() => { if (shouldBePlaying() && video.paused) video.play().catch(() => {}); }, 300);
  });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && shouldBePlaying()) video.play().catch(() => {});
  });

  // Scale dashboard to fit any screen (designed at 1920x1080)
  function scaleDashboard() {
    const baseWidth = 1920, baseHeight = 1080;
    const scale = Math.min(window.innerWidth / baseWidth, window.innerHeight / baseHeight);
    const dash = document.querySelector('.dashboard');
    dash.style.width = baseWidth + 'px';
    dash.style.height = baseHeight + 'px';
    dash.style.transform = `scale(${scale})`;
    dash.style.transformOrigin = 'top left';
    dash.style.position = 'absolute';
    dash.style.left = ((window.innerWidth - baseWidth * scale) / 2) + 'px';
    dash.style.top = ((window.innerHeight - baseHeight * scale) / 2) + 'px';
  }
  scaleDashboard();
  window.addEventListener('resize', scaleDashboard);
</script>
</body>
</html>
